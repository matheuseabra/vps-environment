---
- name: Provision developer VPS
  hosts: all
  become: true
  gather_facts: true

  vars:
    dev_user: dev
    dev_authorized_key: ""
    tailscale_hostname: matheuseabra-vps
    tailscale_auth_key: ""
    dotfiles_repo: https://github.com/matheuseabra/dotfiles.git
    # Pin the source for reproducible VPS builds. Update deliberately.
    dotfiles_version: 113ddc88e607150ffd706028e048a94fa6f62cf4
    chezmoi_version: "2.72.0"

  roles:
    - role: base
    - role: ssh
    - role: developer
    - role: dotfiles
    - role: tailscale
