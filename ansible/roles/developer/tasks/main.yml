---
- name: Install OpenCode for the developer user
  become_user: "{{ dev_user }}"
  ansible.builtin.shell: |
    curl -fsSL https://opencode.ai/install | bash
  args:
    executable: /bin/bash
    creates: "/home/{{ dev_user }}/.opencode/bin/opencode"
  environment:
    HOME: "/home/{{ dev_user }}"

- name: Install Druk for the developer user
  become_user: "{{ dev_user }}"
  ansible.builtin.shell: |
    curl -fsSL https://druk.letstri.dev/install | bash
  args:
    executable: /bin/bash
    creates: "/home/{{ dev_user }}/.druk/bin/druk"
  environment:
    HOME: "/home/{{ dev_user }}"
